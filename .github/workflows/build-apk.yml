name: Build LumaFind Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build LumaFind
        run: bun run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: LumaFind-Web-Build
          path: dist/
